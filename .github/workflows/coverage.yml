name: Test Coverage

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: |
        dotnet restore
        dotnet tool restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    # Every test project except the Playwright suite, which needs browsers and runs from e2e.yml.
    # A failing or undiscovered test fails this step, so a partial report is never uploaded.
    - name: Test with coverage
      run: |
        status=0
        for project in tests/*/*.csproj; do
          name=$(basename "$project" .csproj)
          if [ "$name" = "Osirion.Blazor.E2ETests" ]; then continue; fi
          dotnet test "$project" --no-build --configuration Release \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory "./coverage/$name" \
            --logger "trx;LogFileName=$name.trx" || status=1
        done
        exit $status

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ./coverage/**/*.trx
        retention-days: 7

    - name: Merge coverage reports
      uses: danielpalme/ReportGenerator-GitHub-Action@5.4.7
      with:
        reports: './coverage/**/coverage.cobertura.xml'
        targetdir: 'coveragereport'
        reporttypes: 'HtmlInline;Cobertura;MarkdownSummaryGithub'
        title: 'Osirion.Blazor Coverage Report'

    - name: Upload coverage report artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coveragereport
        retention-days: 30

    - name: Publish coverage summary
      run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coveragereport/Cobertura.xml
        disable_search: true
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
        verbose: true

    # Report only for now: lists methods over CRAP 30 in the job summary without failing the build.
    - name: CRAP analysis
      shell: pwsh
      run: |
        ./tools/run-crap.ps1 -CoverageDirectory ./coverage -SkipTests
        ./tools/verify-crap.ps1 -MaxCrap 30 -ReportOnly

    - name: Upload CRAP reports
      uses: actions/upload-artifact@v4
      with:
        name: crap-reports
        path: docs/crap/*.json
        retention-days: 30

    - name: Add coverage PR comment
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: test-coverage
        path: coveragereport/SummaryGithub.md
