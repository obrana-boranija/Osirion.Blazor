version: 2
updates:
  # Enable version updates for NuGet
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    target-branch: "master"
    labels:
      - "dependencies"
      - "automated pr"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Net9MicrosoftVersion sets the Microsoft packages of the net9.0 target and must stay on 9.x; a grouped update
    # once moved it to 10.x. A new major version means a new target framework, which is changed by hand.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
    # Group updates to reduce PR spam
    groups:
      microsoft-dependencies:
        patterns:
          - "Microsoft.*"
      test-dependencies:
        patterns:
          - "xunit*"
          - "Moq"
          - "bunit*"
          - "NSubstitute"
          - "coverlet*"
          - "FluentAssertions"
          - "Shouldly"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated pr"
      - "github-actions"