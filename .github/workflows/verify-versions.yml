name: Verify Package Versions

# A release branch (release/<version>) must carry that version in every package and in CHANGELOG.md,
# because the publish workflow packs exactly what the project files say.

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  verify-versions:
    name: verify-versions
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'release/')
    steps:
      - uses: actions/checkout@v7

      - name: Every package and the changelog name the release version
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          version="${HEAD_REF#release/}"
          errors=0
          for project in src/*/*.csproj; do
            found=$(grep -oP '(?<=<Version>)[^<]+' "$project" || true)
            if [ "$found" != "$version" ]; then
              echo "::error file=$project::Version is '$found', expected '$version'"
              errors=$((errors + 1))
            fi
          done
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [$version]' section"
            errors=$((errors + 1))
          fi
          [ "$errors" -eq 0 ] || exit 1
          echo "Every package and CHANGELOG.md name $version"
