name: CI

# One workflow for every check a change has to pass. Each job builds what it needs, so a failure names its cause:
# formatting, a test on one operating system, coverage, or a missing component page.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# A newer push to the same pull request or branch makes the older run worthless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      # Whitespace, code style and analyzer rules from .editorconfig. Fix locally with `dotnet format`.
      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes --verbosity minimal

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux runs in the coverage job, which runs every test project too.
        os: [ windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  coverage:
    name: Test and coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Every test project except the Playwright suite, whose tests are all skipped until it is fixed.
      # A failing or undiscovered test fails this step, so a partial report is never uploaded.
      - name: Test with coverage
        run: |
          status=0
          for project in tests/*/*.csproj; do
            name=$(basename "$project" .csproj)
            if [ "$name" = "Osirion.Blazor.E2ETests" ]; then continue; fi
            dotnet test "$project" --no-build --configuration Release \
              --settings coverlet.runsettings \
              --collect:"XPlat Code Coverage" \
              --results-directory "./coverage/$name" \
              --logger "trx;LogFileName=$name.trx" || status=1
          done
          exit $status

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./coverage/**/*.trx
          retention-days: 7

      - name: Merge coverage reports
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # 5.5.11
        with:
          reports: './coverage/**/coverage.cobertura.xml'
          targetdir: 'coveragereport'
          reporttypes: 'HtmlInline;Cobertura;MarkdownSummaryGithub'
          title: 'Osirion.Blazor Coverage Report'

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coveragereport
          retention-days: 30

      - name: Publish coverage summary
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coveragereport/Cobertura.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      # Fails the build when a method exceeds CRAP 30 or a package has more offenders than the last snapshot.
      - name: CRAP gate
        shell: pwsh
        run: |
          ./tools/run-crap.ps1 -CoverageDirectory ./coverage -SkipTests
          ./tools/verify-crap.ps1 -MaxCrap 30

      - name: Upload CRAP reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: crap-reports
          path: docs/crap/*.json
          retention-days: 30

      - name: Comment coverage on the pull request
        # Posted even when the CRAP gate fails, so the coverage numbers are visible on a red pull request.
        # A pull request from a fork gets a read-only token, so it is skipped there.
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('coveragereport/SummaryGithub.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: test-coverage
          path: coveragereport/SummaryGithub.md

  docs:
    name: Component docs
    # The checker builds Windows paths.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Every component has a page
        shell: pwsh
        run: |
          ./tools/check_component_docs.ps1
          $report = './tools/missing_component_docs.json'
          if (-not (Test-Path $report)) { Write-Error "Missing report file"; exit 1 }
          $items = Get-Content $report -Raw | ConvertFrom-Json
          $missing = $items | Where-Object { $_.Component -notlike '_*' }
          if ($missing.Count -gt 0) {
            Write-Host "Components without a page under docs/components:"; $missing | Format-Table -AutoSize
            exit 1
          }
          Write-Host "All components documented"
